name: Upstream Android on official GitHub-hosted Linux

on:
  workflow_dispatch:
    inputs:
      sample:
        description: Independent sample identity, not an automatic retry
        type: choice
        options: ['1', '2', '3']
        default: '1'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5554
      CI_RESULT_DIR: ${{ github.workspace }}/artifacts/run
      CI_GRADLE_WORKERS: '2'
      BENCHMARK_SAMPLE: ${{ inputs.sample }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record runner and prepare the matching job environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          date -u +%FT%TZ > artifacts/first-measured-step.txt
          printf '%s\n' "$ImageOS" "$ImageVersion" > artifacts/github-runner-image.txt
          id > artifacts/job-user.txt
          lscpu > artifacts/cpu.txt
          uname -a > artifacts/kernel.txt
          free -b > artifacts/memory.txt
          df -B1 > artifacts/disk.txt
          test "$(id -u)" != 0
          bash ci/ensure-job-kvm-access.sh artifacts/kvm-initial
          test -d "$JAVA_HOME_17_X64"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          printf 'ANDROID_AVD_HOME=%s/avd\nANDROID_USER_HOME=%s/android-user\nGRADLE_USER_HOME=%s/private-gradle\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/platform-tools\n%s/emulator\n%s/cmdline-tools/latest/bin\n' "$ANDROID_HOME" "$ANDROID_HOME" "$ANDROID_HOME" >> "$GITHUB_PATH"
          python3 ci/sdk-inventory.py "$ANDROID_HOME" > artifacts/sdk-before.txt
      - name: Record JDK and install the upstream build-tools version
        shell: bash
        run: |
          set -euo pipefail
          java -version 2> artifacts/java.txt
          timeout 180 sdkmanager 'build-tools;34.0.0'
      - name: Run the same upstream app and instrumentation suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          avd-name: owned-android-ci
          force-avd-creation: true
          emulator-build: '16740729'
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -no-snapshot -wipe-data -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on -show-kernel
          pre-emulator-launch-script: bash ci/check-sdk.sh
          script: timeout --signal=TERM --kill-after=30s 1800 bash ci/run-connected.sh todo 35
      - name: Record final tool state
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          date -u +%FT%TZ > artifacts/last-measured-step.txt
          df -B1 > artifacts/disk-after.txt
          python3 ci/sdk-inventory.py "$ANDROID_HOME" > artifacts/sdk-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: github-hosted-api35-sample-${{ inputs.sample }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
